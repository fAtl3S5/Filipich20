[project]
name = "filippych-subscription"
version = "1.0.0"
description = "Paid Telegram subscription for «Филипп ещё расскажет»"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.15.0",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "jinja2==3.1.4",
  "orjson==3.10.12",
  "pytz==2024.2",
  "python-dateutil==2.9.0.post0",
  "cryptography==44.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
